[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evidencechain-rag"
version = "0.1.0"
description = "Evidence-grounded RAG with adaptive retrieval and selective verification"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["httpx>=0.27,<1", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
real = ["lightrag-hku>=1.4,<2", "ollama>=0.5.4"]
local = ["sentence-transformers>=3,<6", "sentencepiece>=0.2", "rank-bm25==0.2.2"]
nli = ["torch>=2.2", "transformers>=4.45,<5"]
eval = ["datasets>=3,<5"]
doc = ["docling>=2,<3"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
